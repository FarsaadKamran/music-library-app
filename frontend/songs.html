<!DOCTYPE html>
<html>
<head>
    <title>Songs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Songs</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="artists.html">Artists</a>
    <a href="albums.html">Albums</a>
</nav>

<h3>Add Song</h3>
<input id="name" placeholder="Song Name">
<input id="year" placeholder="Year">
<select id="album_id"></select>
<button onclick="addSong()">Add</button>

<h3>Update Song</h3>
<input id="update_id" placeholder="Song ID" readonly>
<input id="update_name" placeholder="Name">
<input id="update_year" placeholder="Year">
<select id="update_album_id"></select>
<button onclick="updateSong()">Update</button>
<button onclick="clearUpdateForm()">Cancel</button>

<h3>All Songs</h3>
<table>
    <thead><tr><th>ID</th><th>Name</th><th>Year</th><th>Album</th><th>Actions</th></tr></thead>
    <tbody id="table"></tbody>
</table>

<script>
const API_SONGS = "http://localhost:3001/songs";
const API_ALBUMS = "http://localhost:3001/albums";
let albums = [];

async function loadAlbums(){
    const res = await fetch(API_ALBUMS);
    albums = await res.json();
    const albumSelect = document.getElementById("album_id");
    const updateAlbumSelect = document.getElementById("update_album_id");
    albumSelect.innerHTML = "";
    updateAlbumSelect.innerHTML = "";
    albums.forEach(a => {
        albumSelect.innerHTML += `<option value="${a.id}">${a.name}</option>`;
        updateAlbumSelect.innerHTML += `<option value="${a.id}">${a.name}</option>`;
    });
}

async function load(){
    const res = await fetch(API_SONGS);
    const data = await res.json();
    const table = document.getElementById("table");
    table.innerHTML = "";
    data.forEach(s => {
        table.innerHTML += `
            <tr>
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.year}</td>
                <td>${s.album_name}</td>
                <td>
                    <button onclick="editSong(${s.id}, '${s.name}', ${s.year}, ${s.album_id})">Edit</button>
                    <button onclick="deleteSong(${s.id})">Delete</button>
                </td>
            </tr>
        `;
    });
}

async function addSong(){
    const name = document.getElementById("name").value;
    const year = document.getElementById("year").value;
    const album_id = document.getElementById("album_id").value;
    if(!name || !year) return alert("Name and Year required");
    await fetch(API_SONGS, {
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ name, year, album_id })
    });
    document.getElementById("name").value = "";
    document.getElementById("year").value = "";
    load();
}

function editSong(id, name, year, album_id){
    document.getElementById("update_id").value = id;
    document.getElementById("update_name").value = name;
    document.getElementById("update_year").value = year;
    document.getElementById("update_album_id").value = album_id;
}

async function updateSong(){
    const id = document.getElementById("update_id").value;
    const name = document.getElementById("update_name").value;
    const year = document.getElementById("update_year").value;
    const album_id = document.getElementById("update_album_id").value;
    if(!id || !name || !year) return alert("All fields required");
    await fetch(`${API_SONGS}/${id}`, {
        method:"PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ name, year, album_id })
    });
    clearUpdateForm();
    load();
}

function clearUpdateForm(){
    document.getElementById("update_id").value = "";
    document.getElementById("update_name").value = "";
    document.getElementById("update_year").value = "";
}

async function deleteSong(id){
    if(confirm("Delete this song?"))
        await fetch(`${API_SONGS}/${id}`, {method:"DELETE"});
    load();
}

loadAlbums();
load();
</script>
</body>
</html>
